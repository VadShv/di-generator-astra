version: "3.8"

# Продуктовый compose (Фаза 4, шаг 4.3 — прод-конфиг деплоя).
# Безопасность:
#   - Учётные данные Postgres берутся из env-секретов (POSTGRES_USER/PASSWORD/DB),
#     не хардкодятся в compose. Задайте их в .env (или в secrets-менеджере).
#   - Порт БД не публикуется наружу (только внутренняя сеть) — нет экспонирования.
#   - TRUSTED_PROXY_IP указывает адрес Caddy, чтобы getClientIp доверял заголовкам.
#   - Caddy терминирует HTTPS (сертификаты Let's Encrypt) на проде.

services:
  app:
    build: .
    expose:
      - "3001"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AI_PROVIDER_ENCRYPTION_KEY: ${AI_PROVIDER_ENCRYPTION_KEY}
      AI_PROVIDER_ALLOW_DEV_KEY: ${AI_PROVIDER_ALLOW_DEV_KEY:-false}
      ALLOW_OPEN_ACCESS: ${ALLOW_OPEN_ACCESS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Caddy ходит к app изнутри сети — доверяем его заголовкам x-forwarded-for.
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-caddy}
   depends_on:
     db:
       condition: service_healthy
   restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      # Учётные данные из секретов окружения, не хардкод.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-di_generator}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # НЕ публикуем порт БД наружу — только внутренняя docker-сеть.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-di_generator}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      # Домен для HTTPS-сертификата Let's Encrypt; задайте в .env.
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS required (e.g. di.example.com)}
   depends_on:
      app:
        condition: service_healthy
   restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
